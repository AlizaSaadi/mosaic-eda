name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # torch and transformers only power GPU transcription on the Space; tests don't need them
      - run: grep -vE '^(torch|transformers)==' requirements.txt > requirements-ci.txt
      - run: pip install -r requirements-ci.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
