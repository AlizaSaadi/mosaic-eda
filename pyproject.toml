[project]
name = "mosaic-eda"
version = "0.10.1"
description = "MOSAIC EDA: Multimodal Orchestrated System for Analysis, Inspection & Cleaning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls the real Gemini API and uses free-tier quota (run with -m live)",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# scripts saved from recorded runs, kept exactly as a run produced them
extend-exclude = ["examples/replays"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# sys.path and console setup must run before the app imports
"app.py" = ["E402"]
# %-formatting keeps the {c} placeholders in the code templates unambiguous
"src/mosaic/tables/ops.py" = ["UP031"]
# SVG path data reads best on one line
"src/mosaic/ui/art.py" = ["E501"]
# ground truth: one planted problem per line, patterns kept whole
"eval/golden.py" = ["E501"]
